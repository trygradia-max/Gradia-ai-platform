name: ci-integration

# DB-backed integration tests (approval engine vs real Postgres). Separate from
# the fast `ci` workflow so a slow Supabase boot can't gate the pure unit tier.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-int-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    # BLOCKING since 2026-07-30 (P0-002). Quarantine history: non-blocking
    # 2026-06-18..2026-07-30 after an unpinned CLI auto-update broke the local
    # stack — the export step silently produced an empty service-role key that
    # masqueraded as "permission denied for table shops" at seed. Fixed by the
    # CLI pin below plus the fail-loud export step; verified green on the exact
    # pinned version (4/4 integration tests) before the quarantine was removed.
    # Per 09-testing-strategy.md §5: `continue-on-error` on any test job is
    # forbidden — re-quarantining requires a program/blocked.md entry with an
    # owner and an exit date.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (was `latest`). An unpinned CLI auto-updated after 2026-06-04
          # and changed local-stack permissions, breaking the seed. Pinning stops
          # the environment from drifting underneath us; bump deliberately and
          # only after a green run. If permission errors persist, step this back
          # to the release that was current on 2026-06-04.
          version: 2.98.2
      - run: npm ci

      # Boots the full local stack (Postgres + auth + PostgREST) and applies
      # every migration in supabase/migrations.
      - name: Start Supabase
        run: supabase start

      # Export the test DB URL + service-role key. Tolerant of CLI key-name
      # changes across versions (the original failure mode), and FAILS LOUD if
      # either value is missing — a silent empty key previously masqueraded as a
      # Postgres permission error. On failure it prints the actual JSON keys so
      # the cause is obvious from the run log.
      - name: Export local Supabase env
        run: |
          set -euo pipefail
          json=$(supabase status -o json)
          url=$(echo "$json" | jq -r '.API_URL // .api_url // ."api.url" // empty')
          key=$(echo "$json" | jq -r '.SERVICE_ROLE_KEY // .service_role_key // ."auth.service_role_key" // empty')
          anon=$(echo "$json" | jq -r '.ANON_KEY // .anon_key // ."auth.anon_key" // empty')
          if [ -z "$url" ] || [ -z "$key" ] || [ -z "$anon" ]; then
            echo "::error::Could not extract Supabase URL/service-role/anon key. Keys present in status JSON:"
            echo "$json" | jq -r 'keys'
            exit 1
          fi
          echo "SUPABASE_TEST_URL=$url" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"
          # Anon key: P0-005's ledger RLS permission tests sign in as a real
          # owner session to prove SELECT-only. Local demo-stack key, not a secret.
          echo "SUPABASE_TEST_ANON_KEY=$anon" >> "$GITHUB_ENV"
          echo "Supabase env OK (service-role key length=${#key})."

      - name: Run integration tests
        run: npm run test:int

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
